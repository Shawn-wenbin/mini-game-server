[project]
name = "minigame-server"
version = "0.1.0"
description = "MiniGameClient 本地联调用的 Phase 1 至 Phase 4 后端"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "pymysql[rsa]>=1.1,<2",
    "pydantic-settings>=2.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
